version: "3.8"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    environment:
      - PORT=8501
      - BACKEND_MERGE=http://backend:8000/merge
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped
